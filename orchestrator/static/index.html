<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Q&A</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 2rem auto;
    padding: 0 1rem;
    background: #f5f5f7;
    color: #1c1c1e;
  }
  h1 { font-size: 1.25rem; }
  #log {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .msg {
    padding: 0.6rem 0.9rem;
    border-radius: 0.75rem;
    max-width: 85%;
    white-space: pre-wrap;
    line-height: 1.4;
  }
  .user {
    align-self: flex-end;
    background: #0a84ff;
    color: white;
  }
  .bot {
    align-self: flex-start;
    background: white;
    border: 1px solid #e0e0e0;
  }
  .sources {
    font-size: 0.75rem;
    color: #6e6e73;
    margin-top: 0.35rem;
  }
  form {
    display: flex;
    gap: 0.5rem;
  }
  input {
    flex: 1;
    padding: 0.6rem 0.8rem;
    border-radius: 0.5rem;
    border: 1px solid #d0d0d5;
    font-size: 1rem;
  }
  button {
    padding: 0.6rem 1.1rem;
    border-radius: 0.5rem;
    border: none;
    background: #0a84ff;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<h1>Ask <about YOUR NAME'>s CV</h1>
<div id="log"></div>
<form id="form">
  <input id="question" type="text" placeholder="What DevOps experience do you have?" autocomplete="off" required>
  <button id="submit" type="submit">Ask</button>
</form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('question');
const submitBtn = document.getElementById('submit');

function addMessage(text, who, sources) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  if (sources && sources.length) {
    const s = document.createElement('div');
    s.className = 'sources';
    s.textContent = 'Sources: ' + sources.join(', ');
    div.appendChild(s);
  }
  log.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
  return div;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  addMessage(question, 'user');
  input.value = '';
  submitBtn.disabled = true;
  const pending = addMessage('Thinking…', 'bot');

  try {
    const resp = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    if (!resp.ok) throw new Error('Request failed: ' + resp.status);
    const data = await resp.json();
    pending.textContent = data.answer;
    if (data.sources && data.sources.length) {
      const s = document.createElement('div');
      s.className = 'sources';
      s.textContent = 'Sources: ' + data.sources.join(', ') + (data.cached ? ' (cached)' : '');
      pending.appendChild(s);
    }
  } catch (err) {
    pending.textContent = 'Something went wrong: ' + err.message;
  } finally {
    submitBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
