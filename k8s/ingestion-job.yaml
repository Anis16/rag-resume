# ingestion-job.yaml — run once (and again any time cv.md changes)
apiVersion: batch/v1
kind: Job
metadata:
  name: cv-ingest
  namespace: cv-rag
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 192.168.49.2
        searches:
          - cv-rag.svc.cluster.local
          - svc.cluster.local
          - cluster.local
      containers:
        - name: cv-ingest
          image: cv-rag-ingest:v1    # <-- replace with your pushed image
          env:
            - name: QDRANT_URL
              value: "http://qdrant:6333"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
