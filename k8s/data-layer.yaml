# data-layer.yaml — Qdrant (vector DB) and Redis (response cache)
apiVersion: v1
kind: Namespace
metadata:
  name: cv-rag

---
# Qdrant — single replica is fine, the CV corpus is tiny and static
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: cv-rag
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.10.1
          ports:
            - containerPort: 6333
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: qdrant-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: cv-rag
spec:
  selector:
    app: qdrant
  ports:
    - port: 6333
      targetPort: 6333

---
# Redis — response cache for repeated questions
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cv-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cv-rag
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
